# WaveletTSModel â€” multiresolution wavelet front-end + Qwen3.5-4B (LoRA).
# Same recipe as chatts_precise.yaml in every field; only the perception module
# changes: fixed Haar pyramid, 256-token budget per channel (coarse band +
# top-k detail coefficients), trainable value/scale/position embeddings.
# Token count is constant in L by construction â€” no OOM cliff on long cells.

name: anomaly_xl_wavelet_precise_qwen35_4b
seed: 42

dataset:
  name: anomaly_xl_precise
  extra_kwargs:
    variant: precise
    train_dir: anomalyXL/datasets/anomalyxl-train/anomalyxl-precise

model:
  architecture: wavelet

  encoder:
    type: wavelet
    output_dim: 512
    num_tokens: 256
    coarse_blocks: 128
    n_pos_freqs: 16
    freeze: false

  projector:
    type: mlp

  extra_kwargs:
    encoding_method: raw
    freeze_lm_embeddings: true

backbone:
  name: qwen
  model_id: Qwen/Qwen3.5-4B

training:
  backbone_training: lora
  batch_size: 1
  num_epochs: 5

  learning_rate:
    default: 1.0e-4

  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03

  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min

  logging:
    wandb:
      enabled: false

  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min

  dataloader:
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true

runtime:
  output_dir: results
  run_name: anomaly_xl_wavelet_precise_qwen35_4b
  max_samples: null
