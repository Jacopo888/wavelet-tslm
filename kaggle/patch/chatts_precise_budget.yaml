# ChatTS anchor - reduced-budget run, mirror of wavelet_precise_budget.yaml in
# every training field (1500 samples x 1 epoch, frozen LM embeddings, periodic
# checkpoints). Same architecture family as the wavelet variant (placeholder
# embedding substitution + frozen encoder + LoRA); ONLY the perception module
# differs: chronos-2 uniform patching vs multiresolution wavelet tokens.
# NOTE freeze_lm_embeddings deviates from the official chatts config (false)
# for memory parity with the wavelet run - both anchors trained identically.

name: anomaly_xl_chatts_precise_budget
seed: 42

dataset:
  name: anomaly_xl_precise
  extra_kwargs:
    variant: precise
    train_dir: anomalyXL/datasets/anomalyxl-train/anomalyxl-precise

model:
  architecture: chatts

  encoder:
    type: chronos2
    model_id: amazon/chronos-2
    freeze: true

  projector:
    type: mlp

  extra_kwargs:
    encoding_method: raw
    freeze_lm_embeddings: true

backbone:
  name: qwen
  model_id: Qwen/Qwen3.5-4B

training:
  backbone_training: lora
  batch_size: 1
  num_epochs: 1

  learning_rate:
    default: 1.0e-4

  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03

  early_stopping:
    enabled: false
    patience: 3
    metric: val_loss
    mode: min

  logging:
    wandb:
      enabled: false

  checkpointing:
    save_every_n_steps: 500
    save_best: true
    metric: val_loss
    mode: min

  dataloader:
    num_workers: 0
    pin_memory: false

runtime:
  output_dir: results
  run_name: anomaly_xl_chatts_precise_budget
  max_samples: 1500
