# L2 pilot — arm `code` (the TimeRLM paper protocol, scaled to one A40-24Q vGPU).
#
# Derived from timerlm/configs/rl/anomalyxl_rlm_v5_ablation_fixed.toml (the paper's RL
# config) for prime-rl c5afcaa2e (2026-06-26, the last upstream commit whose schema and
# verifiers submodule match the paper's env; see l2/PROTOCOL-L2.md). Everything the paper
# fixed is kept: generator taskset at fixed theta, RLM harness, reward = scorer +
# group-aware token-expense penalty (coef 0.1) + forced-final penalty, renderer qwen3.5,
# online eval on the precise val, two-phase negatives schedule (driven by the launch env,
# see node_l2_run.sh). What changes is hardware-forced and identical for both arms:
#   - policy Qwen3.5-2B (4B does not fit next to vLLM in 24 GB), LoRA r32/a64 instead of
#     full-parameter, lr 2e-5 (LoRA needs more than the paper's 7e-6 full-param)
#   - seq_len 32768 (was 65536), 12-turn cap (was 15), 16k completion budget (was 24k)
#   - 64 rollouts/step = 8 prompts x 8 (was 1024 = 128 x 8), 60 steps (was 400)
#   - ONE standalone vLLM server on the same GPU (was two servers on two GPUs)
# The wavelet arm (l2_pilot_wavelet.toml) differs from this file ONLY in: output_dir,
# wandb name, and the RLM_SKILLS harness env entry. The task-note variant is selected by
# the launch env (TIMERLM_NOTE_VARIANT), not here. Run from ~/timerlm/prime-rl.

max_steps = 60
seq_len = 32768
output_dir = "/root/l2/runs/code"

[deployment]
num_train_gpus = 1
num_infer_gpus = 0

[model]
name = "/root/timerlm/l2/model_snapshot"

[weight_broadcast]
type = "filesystem"

[orchestrator.renderer]
name = "qwen3.5"

[wandb]
project = "timerlm-l2"
name = "l2-pilot-code-qwen35-2b"

# At this pin `batch_size` counts ROLLOUTS (samples) per step and must be divisible by
# group_size: 64 rollouts = 8 prompts x 8. (The paper's fork counted prompts: "64x8 = 512".)
[orchestrator]
batch_size = 64
group_size = 8
max_inflight_rollouts = 16
max_off_policy_steps = 8

[orchestrator.advantage]
type = "default"

[orchestrator.advantage.length_penalty]
coef = 0.1
gate_by_correctness = false

[orchestrator.train.sampling]
max_completion_tokens = 2048

[[orchestrator.train.env]]
name = "anomalyxl-generator"
taskset = { id = "timeseries-qa-v1", generator = { num_tasks = 100000, run_seed = 20260903 } }
harness = { id = "timeseries-qa-v1", summarize_at_tokens = 22000, env = { RLM_MAX_TOKENS = "16384", RLM_MAX_OUTPUT = "4096", RLM_MAX_TURNS = "12" } }

# Online eval every 10 steps on the pinned local precise VALIDATION split (first 100 rows =
# eval pool, 32 sampled), through the v0 eval env exactly like the paper.
[[orchestrator.eval.env]]
id = "timeseries-qa"
name = "anomalyxl-rlm-text-eval"
args = { dataset = "anomalyxl", repo_or_path = "/root/timerlm/l2/data/val", mode = "rlm", use_image = false, use_local_executor = true, eval_size = 100, max_turns = 12 }

[orchestrator.eval]
interval = 10
num_examples = 32
skip_first_step = true

[orchestrator.student.client]
base_url = ["http://localhost:8000/v1"]

[trainer.optim]
lr = 2e-5

[trainer.model]
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true
fused_lm_head_token_chunk_size = "auto"

[trainer.model.ac]
mode = "full"

[trainer.model.lora]
rank = 32
alpha = 64
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "in_proj_qkv", "in_proj_z", "in_proj_b", "in_proj_a", "out_proj"]

# Phase boundary of the negatives schedule = step 35 (paper: 220/400 = 55%; 35/60 = 58%,
# the nearest checkpoint multiple). keep_interval keeps step_35 for the phase-2 resume.
[ckpt]
interval = 5
keep_last = 3
keep_interval = 35
