# Schedule-faithful 1-5 epoch pilot; node_pilot_v3.sh replaces run_name.
name: anomaly_xl_wavelet_v3pilot_gate
seed: 42

dataset:
  name: anomaly_xl_precise
  extra_kwargs:
    variant: precise
    train_dir: anomalyXL/datasets/anomalyxl-train/anomalyxl-precise

model:
  architecture: wavelet_v3
  encoder:
    type: wavelet_v3
    output_dim: 512
    num_tokens: 256
    coarse_blocks: 128
    n_pos_freqs: 16
    freeze: false
    level_topm: 1024
    n_heads: 8
    mlp_ratio: 4
    dropout: 0.0
    level_gate: true
    noise_tau: 1.0
    pos_dtype: input
    locality_sigma: 0.0078125
    context_scale_init: 0.1
    max_levels: 10
    tied: true
    depth_mode: full
    reader_mode: cross_only
    self_attn_scale_init: 0.1
    mlp_scale_init: 0.1
    token_gate: true
  projector:
    type: mlp
  extra_kwargs:
    encoding_method: raw
    freeze_lm_embeddings: true

backbone:
  name: qwen
  model_id: Qwen/Qwen3.5-4B

training:
  backbone_training: lora
  batch_size: 1
  num_epochs: 5
  learning_rate:
    default: 1.0e-4
    context: 1.0e-3
    context_scale: 1.0e-5
    context_token_gate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  early_stopping:
    enabled: false
    patience: 3
    metric: val_loss
    mode: min
  logging:
    wandb:
      enabled: false
  checkpointing:
    save_every_n_steps: 500
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 0
    pin_memory: false

runtime:
  output_dir: results
  run_name: anomaly_xl_wavelet_v3pilot_gate
  max_samples: null
